services:
  # 🎮 Backend Web Service (Node.js & Socket.io)
  - type: web
    name: who-imposter-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 10000

  # ⚡ Frontend Static Site (React + Vite)
  - type: static
    name: who-imposter-frontend
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_SERVER_URL
        fromService:
          type: web
          name: who-imposter-backend
          property: host
